name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==3.0.11

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools

          # Скачиваем cmdline-tools
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
               -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d /tmp/cmdtools

          # Кладём в нужное место
          mv /tmp/cmdtools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest

          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin

          # Принимаем лицензии
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses 2>/dev/null || true

          # Устанавливаем компоненты
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          # Создаём старую структуру tools/bin которую ищет buildozer
          mkdir -p $ANDROID_SDK_ROOT/tools/bin
          ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
                 $ANDROID_SDK_ROOT/tools/bin/sdkmanager
          ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager \
                 $ANDROID_SDK_ROOT/tools/bin/avdmanager

          echo "=== SDK structure ==="
          ls $ANDROID_SDK_ROOT/
          ls $ANDROID_SDK_ROOT/tools/bin/
          ls $ANDROID_SDK_ROOT/build-tools/

      - name: Download xray ARM64
        run: |
          mkdir -p assets
          wget -q "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip" \
               -O xray.zip
          unzip -o xray.zip xray -d assets/
          chmod +x assets/xray
          ls -la assets/

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('buildozer.spec') }}
          restore-keys: gradle-

      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          export PATH=$PATH:$ANDROID_SDK_ROOT/tools/bin
          export PATH=$PATH:$ANDROID_SDK_ROOT/platform-tools

          # Принимаем лицензии ещё раз перед сборкой
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses 2>/dev/null || true

          buildozer -v android debug 2>&1 | tee build.log

          echo "=== Build finished ==="
          find . -name "*.apk" 2>/dev/null || echo "No APK found"
          ls -la bin/ 2>/dev/null || echo "No bin/ directory"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nova-vpn-apk
          path: bin/*.apk
          retention-days: 7

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 3
