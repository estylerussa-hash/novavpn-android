name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04 # ВАЖНО: Используем 22.04, так как в 24.04 (latest) удален distutils из Python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11 # ВАЖНО: Buildozer и Android SDK работают стабильно только на Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Check Python version
        run: |
          python3 --version
          which python3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential \
            python3-pip

      - name: Install Python packages
        run: |
          pip3 install --upgrade pip
          # Убрал жесткую привязку к версии buildozer, лучше использовать последнюю стабильную
          # Cython 0.29.33 - самая стабильная версия для python-for-android
          pip3 install buildozer "Cython<3.0.0" virtualenv

      - name: Download xray ARM64
        run: |
          mkdir -p assets
          wget -q "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip" \
               -O xray.zip
          unzip -o xray.zip xray -d assets/
          chmod +x assets/xray
          ls -la assets/

      - name: Cache buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-project-

      - name: Build APK
        # yes | автоматически отвечает "Y" на все запросы Buildozer (лицензии, скачивание NDK/SDK)
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
          
          echo "=== Build finished ==="
          find . -name "*.apk" 2>/dev/null || echo "No APK found"
          ls -la bin/ 2>/dev/null || echo "No bin/ directory"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nova-vpn-apk
          path: bin/*.apk
          retention-days: 7

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always() # Загрузит лог даже если сборка упадет (поможет для дебага)
        with:
          name: build-log
          path: build.log
          retention-days: 3
